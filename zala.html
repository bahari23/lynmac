<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lynamc Ltd | Innovation & Growth Solutions</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --text: #334155;
      --bg: #f8fafc;
    }
    
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--primary);
      line-height: 1.5;
    }

    header {
      background-color: #ffffff;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: -0.025em;
      color: var(--primary);
    }

    .brand span {
      color: var(--accent);
    }

    .nav-links a {
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      margin-left: 1.5rem;
      font-size: 0.95rem;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    .hero {
      max-width: 1000px;
      margin: 0 auto;
      padding: 6rem 1.5rem;
      text-align: center;
    }

    .tagline {
      display: inline-block;
      background-color: #dbeafe;
      color: var(--accent);
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin: 0 0 1.25rem 0;
      color: var(--primary);
    }

    .hero p {
      font-size: 1.25rem;
      color: var(--text);
      max-width: 600px;
      margin: 0 auto 2.5rem auto;
    }

    .cta-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background-color: #1d4ed8;
    }

    .btn-secondary {
      background-color: #ffffff;
      color: var(--primary);
      border: 1px solid #e2e8f0;
    }

    .btn-secondary:hover {
      background-color: #f1f5f9;
    }

    footer {
      text-align: center;
      padding: 2rem;
      border-top: 1px solid #e2e8f0;
      background-color: #ffffff;
      color: #94a3b8;
      font-size: 0.875rem;
      position: fixed;
      bottom: 0;
      width: 100%;
      box-sizing: border-box;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Lynamc<span>.</span></div>
    <nav class="nav-links">
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main class="hero">
    <span class="tagline">Welcome to Lynamc Ltd</span>
    <h1>Smart solutions for the modern enterprise.</h1>
    <p>We build, scale, and optimize core business frameworks so you can focus entirely on reaching your destination.</p>
    <div class="cta-group">
      <a href="#" class="btn btn-primary">Explore Demo</a>
      <a href="#" class="btn btn-secondary">Learn More</a>
    </div>
  </main>

  <footer>
    &copy; 2026 Lynamc Ltd. All rights reserved. Demo Environment.
  </footer>

</body>
</html>
